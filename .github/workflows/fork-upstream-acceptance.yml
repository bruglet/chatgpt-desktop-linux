name: Fork Upstream Acceptance

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  upstream-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --test .github/fork/upstream-acceptance.test.cjs
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71
        with:
          script: |
            const verify = require('./.github/fork/upstream-acceptance.cjs');
            await verify({ github, context, core });
