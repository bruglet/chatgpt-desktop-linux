name: Homebrew CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false
      source_sha:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Homebrew changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] ||
             ! git diff --quiet "$BASE_SHA" HEAD -- Casks packaging/homebrew '.github/workflows/homebrew-*.yml'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607
        if: steps.changes.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 26
      - name: Install test dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg cpio xvfb xdotool dbus-x11 libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Verify additive upstream boundary
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 packaging/homebrew/test_boundary.py "$BASE_SHA"
      - name: Unit and upstream regression tests
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -m unittest discover -s packaging/homebrew -p 'test_*.py'
          bash -n packaging/homebrew/*.sh
          node --test launcher/start.test.js scripts/lib/linux-features.test.js scripts/patch-linux-window-ui.test.js linux-features/tray-usage/test.js linux-features/mcp-helper-reaper/test.js linux-features/node-repl-reaper/test.js
          node --test linux-features/agent-workspace/test.js linux-features/community-features-in-gui-settings/test.js linux-features/global-dictation/test.js linux-features/global-dictation-gnome/test.js linux-features/wayland-global-shortcuts/test.js
          node --test linux-features/appshots/test.js linux-features/start-minimized-to-tray/test.js linux-features/model-picker-default-presets/test.js
          python3 packaging/homebrew/render-cask.py packaging/homebrew/release.json "$RUNNER_TEMP/expected.rb"
          cmp Casks/chatgpt-community.rb "$RUNNER_TEMP/expected.rb"
          brew style Casks/chatgpt-community.rb
      - name: Download candidate
        if: steps.changes.outputs.run == 'true' && inputs.candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: homebrew-candidate
          path: candidate
      - name: Build and smoke-test payload
        if: steps.changes.outputs.run == 'true' && inputs.candidate
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          brew install rpm2cpio rust
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'packaging/homebrew')
          from candidate import input_hash
          release = json.loads(Path('candidate/release.json').read_text())
          assert release['sourceInputSha256'] == input_hash(Path.cwd()), 'Candidate source inputs changed'
          PY
          bash packaging/homebrew/build-payload.sh candidate/release.json "$RUNNER_TEMP/homebrew-payload"
      - name: Exercise published cask with sandbox enabled
        if: steps.changes.outputs.run == 'true' && inputs.candidate == false
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash packaging/homebrew/lifecycle.sh
      - name: Upload validated Homebrew payload
        if: steps.changes.outputs.run == 'true' && inputs.candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-payload-${{ matrix.os }}
          path: ${{ runner.temp }}/homebrew-payload/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-diagnostics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/homebrew-logs/*.log
            ${{ runner.temp }}/homebrew-logs/*.json
          if-no-files-found: ignore
