name: Sync Ready Upstream

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-ready-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: ilysenko/codex-desktop-linux
  SYNC_BRANCH: automation/upstream-sync

jobs:
  sync-ready-upstream:
    name: Open Upstream Sync Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Require a sync token that can update workflow files
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "Configure UPSTREAM_SYNC_TOKEN with Contents, Pull requests, and workflow write access." >&2
            echo "A separate token is required because pushes made by GITHUB_TOKEN do not trigger pull request workflows." >&2
            exit 1
          fi

      - name: Check out the fork default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install signed-package resolution dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl dpkg-dev gnupg

      - name: Resolve the current signed Linux package campaign
        id: linux
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/official-linux-release.json"
          node scripts/automation/upstream-linux-package-watchdog/watchdog.js --json > "$result_file"
          cat "$result_file"
          node - "$result_file" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const [resultPath, outputPath] = process.argv.slice(2);
          const release = JSON.parse(fs.readFileSync(resultPath, "utf8")).release;
          if (!release || !/^[0-9a-f]{64}$/.test(release.releaseId)) {
            throw new Error("signed Linux package watchdog returned no valid release identity");
          }
          const lines = [
            `release_id=${release.releaseId}`,
            `version=${release.version}`,
            `amd64_repository_path=${release.packages?.amd64?.repositoryPath}`,
            `amd64_sha256=${release.packages?.amd64?.sha256}`,
            `arm64_repository_path=${release.packages?.arm64?.repositoryPath}`,
            `arm64_sha256=${release.packages?.arm64?.sha256}`,
          ];
          if (lines.some((line) => line.endsWith("=undefined"))) {
            throw new Error("signed Linux package watchdog returned incomplete package metadata");
          }
          fs.appendFileSync(outputPath, `${lines.join("\n")}\n`);
          NODE

      - name: Find the accepted upstream head
        id: upstream
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          OFFICIAL_RELEASE_ID: ${{ steps.linux.outputs.release_id }}
        with:
          script: |
            const [owner, repo] = process.env.UPSTREAM_REPOSITORY.split('/');
            const { data: upstreamRepo } = await github.rest.repos.get({ owner, repo });
            const { data: branch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: upstreamRepo.default_branch,
            });
            const headSha = branch.commit.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'upstream-build-app.yml',
              branch: upstreamRepo.default_branch,
              status: 'completed',
              per_page: 50,
            });
            const acceptedRun = data.workflow_runs.find((run) =>
              run.head_sha === headSha &&
              run.conclusion === 'success' &&
              ['push', 'workflow_dispatch'].includes(run.event) &&
              run.head_repository?.full_name === process.env.UPSTREAM_REPOSITORY);
            if (!acceptedRun) {
              core.notice(`Upstream ${headSha} does not yet have a successful official Linux build.`);
              core.setOutput('ready', 'false');
              return;
            }
            core.setOutput('ready', 'true');
            core.setOutput('sha', headSha);
            core.setOutput('short_sha', headSha.slice(0, 12));
            core.setOutput('run_url', acceptedRun.html_url);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const marker = `<!-- official-linux-release:${process.env.OFFICIAL_RELEASE_ID} -->`;
            core.setOutput('released', releases.some((release) => release.body?.includes(marker)) ? 'true' : 'false');

      - name: Fetch the accepted upstream revision
        if: steps.upstream.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --no-tags upstream "${{ steps.upstream.outputs.sha }}"

      - name: Check whether the revision is already synchronized
        if: steps.upstream.outputs.ready == 'true'
        id: synchronized
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${{ steps.upstream.outputs.sha }}" HEAD; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the synchronization branch
        if: steps.upstream.outputs.ready == 'true' && steps.synchronized.outputs.already != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH" || true
          git switch -C "$SYNC_BRANCH"
          git merge --no-edit --no-ff "${{ steps.upstream.outputs.sha }}" \
            -m "Merge accepted upstream ${{ steps.upstream.outputs.short_sha }}"
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"

      - name: Open the synchronization pull request
        if: steps.upstream.outputs.ready == 'true' && steps.synchronized.outputs.already != 'true'
        id: sync_pr
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.SYNC_BRANCH}`;
            const base = context.payload.repository.default_branch;
            const { data: openPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 1,
            });
            let pull = openPulls[0];
            if (!pull) {
              const body = [
                `Synchronizes the fork with upstream commit \`${process.env.UPSTREAM_SHA}\` after the`,
                'upstream official Linux package workflow succeeded.',
                '',
                `Official Linux campaign: \`${process.env.OFFICIAL_RELEASE_ID}\``,
                `Validation run: ${process.env.ACCEPTANCE_RUN_URL}`,
                '',
                `<!-- automated-upstream-sync:${process.env.UPSTREAM_SHA} -->`,
                `<!-- official-linux-release:${process.env.OFFICIAL_RELEASE_ID} -->`,
              ].join('\n');
              ({ data: pull } = await github.rest.pulls.create({
                owner,
                repo,
                base,
                head: process.env.SYNC_BRANCH,
                title: `Sync accepted upstream ${process.env.UPSTREAM_SHORT_SHA}`,
                body,
              }));
            }
            core.setOutput('url', pull.html_url);
        env:
          ACCEPTANCE_RUN_URL: ${{ steps.upstream.outputs.run_url }}
          OFFICIAL_RELEASE_ID: ${{ steps.linux.outputs.release_id }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          UPSTREAM_SHORT_SHA: ${{ steps.upstream.outputs.short_sha }}

      - name: Enable auto-merge
        if: steps.upstream.outputs.ready == 'true' && steps.synchronized.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_URL: ${{ steps.upstream.outputs.run_url }}
          OFFICIAL_RELEASE_ID: ${{ steps.linux.outputs.release_id }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          PR_URL: ${{ steps.sync_pr.outputs.url }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_URL" --auto --merge
          {
            echo "## Accepted upstream revision"
            echo
            echo "- Commit: \`$UPSTREAM_SHA\`"
            echo "- Official Linux campaign: \`$OFFICIAL_RELEASE_ID\`"
            echo "- Validation: $ACCEPTANCE_RUN_URL"
            echo "- Pull request: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch a release when source is already synchronized
        if: >-
          steps.upstream.outputs.ready == 'true' &&
          steps.synchronized.outputs.already == 'true' &&
          steps.upstream.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-appimage-artifact.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            --field publish_release=true \
            --field features='mcp-helper-reaper,node-repl-reaper,directory-only-working-tree-watch,shared-app-server-socket' \
            --field release_id="${{ steps.linux.outputs.release_id }}" \
            --field version="${{ steps.linux.outputs.version }}" \
            --field amd64_repository_path="${{ steps.linux.outputs.amd64_repository_path }}" \
            --field amd64_sha256="${{ steps.linux.outputs.amd64_sha256 }}" \
            --field arm64_repository_path="${{ steps.linux.outputs.arm64_repository_path }}" \
            --field arm64_sha256="${{ steps.linux.outputs.arm64_sha256 }}"
          {
            echo "## AppImage release dispatched"
            echo
            echo "- Upstream commit: \`${{ steps.upstream.outputs.sha }}\`"
            echo "- Official Linux campaign: \`${{ steps.linux.outputs.release_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
