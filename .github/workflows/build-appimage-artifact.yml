name: Build AppImage Artifact
run-name: AppImage ${{ inputs.release_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the validated AppImage as a GitHub Release
        type: boolean
        required: true
        default: false
      release_id:
        description: Exact signed Linux package campaign identity
        type: string
        required: false
      version:
        description: Expected signed Linux package version
        type: string
        required: false
      amd64_repository_path:
        description: Expected signed amd64 package path
        type: string
        required: false
      amd64_sha256:
        description: Expected signed amd64 package SHA-256
        type: string
        required: false
      arm64_repository_path:
        description: Expected signed arm64 package path
        type: string
        required: false
      arm64_sha256:
        description: Expected signed arm64 package SHA-256
        type: string
        required: false
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

env:
  APPIMAGE_ID: io.github.bruglet.chatgpt

concurrency:
  group: build-appimage-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-appimage:
    name: Build x86-64 AppImage
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'automation/upstream-sync' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the selected fork revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@56f84321dbccf38fb67ce29ab63e4754056677e0
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl dpkg-dev gnupg make python3

      - name: Download appimagetool
        id: appimagetool
        run: |
          set -euo pipefail
          tool_path="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            -o "$tool_path" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod 0755 "$tool_path"
          test -s "$tool_path"
          echo "path=$tool_path" >> "$GITHUB_OUTPUT"

      - name: Resolve and bind the signed Linux package campaign
        id: upstream
        env:
          EXPECTED_RELEASE_ID: ${{ inputs.release_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_AMD64_PATH: ${{ inputs.amd64_repository_path }}
          EXPECTED_AMD64_SHA256: ${{ inputs.amd64_sha256 }}
          EXPECTED_ARM64_PATH: ${{ inputs.arm64_repository_path }}
          EXPECTED_ARM64_SHA256: ${{ inputs.arm64_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p upstream/amd64
          release_file="$RUNNER_TEMP/official-linux-release.json"
          node scripts/automation/upstream-linux-package-watchdog/watchdog.js --json > "$release_file"
          cat "$release_file"
          node - "$release_file" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const [releasePath, outputPath] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(releasePath, "utf8"));
          const release = value.release;
          const expected = {
            releaseId: process.env.EXPECTED_RELEASE_ID,
            version: process.env.EXPECTED_VERSION,
            amd64Path: process.env.EXPECTED_AMD64_PATH,
            amd64Sha: process.env.EXPECTED_AMD64_SHA256,
            arm64Path: process.env.EXPECTED_ARM64_PATH,
            arm64Sha: process.env.EXPECTED_ARM64_SHA256,
          };
          if (!release || !/^[0-9a-f]{64}$/.test(release.releaseId)) {
            throw new Error("signed Linux package watchdog returned no valid release identity");
          }
          const provided = Object.values(expected).filter(Boolean).length;
          if (provided !== 0 && provided !== Object.keys(expected).length) {
            throw new Error("all signed Linux campaign inputs must be provided together");
          }
          const actual = {
            releaseId: release.releaseId,
            version: release.version,
            amd64Path: release.packages?.amd64?.repositoryPath,
            amd64Sha: release.packages?.amd64?.sha256,
            arm64Path: release.packages?.arm64?.repositoryPath,
            arm64Sha: release.packages?.arm64?.sha256,
          };
          if (provided !== 0 && Object.keys(expected).some((key) => expected[key] !== actual[key])) {
            throw new Error(`signed Linux package campaign changed: ${JSON.stringify({ expected, actual })}`);
          }
          const lines = [
            `release_id=${actual.releaseId}`,
            `version=${actual.version}`,
            `amd64_repository_path=${actual.amd64Path}`,
            `amd64_sha256=${actual.amd64Sha}`,
            `arm64_repository_path=${actual.arm64Path}`,
            `arm64_sha256=${actual.arm64Sha}`,
          ];
          fs.appendFileSync(outputPath, `${lines.join("\n")}\n`);
          fs.copyFileSync(releasePath, "upstream-linux-release.json");
          NODE

          package_path="$(node scripts/lib/upstream-linux-package.js \
            --output-dir upstream/amd64 \
            --metadata upstream/amd64.json \
            --key-base64 assets/openai-codex-linux-repository-key.gpg.base64 \
            --arch amd64)"
          node - "upstream/amd64.json" "upstream-linux-release.json" <<'NODE'
          const fs = require("node:fs");
          const [metadataPath, releasePath] = process.argv.slice(2);
          const metadata = JSON.parse(fs.readFileSync(metadataPath, "utf8"));
          const release = JSON.parse(fs.readFileSync(releasePath, "utf8")).release;
          const expected = release?.packages?.amd64;
          for (const [label, actual, wanted] of [
            ["version", metadata.version, release.version],
            ["repository path", metadata.repositoryPath, expected?.repositoryPath],
            ["SHA-256", metadata.sha256, expected?.sha256],
          ]) {
            if (actual !== wanted) throw new Error(`signed amd64 package ${label} changed during resolution`);
          }
          NODE
          echo "package=$package_path" >> "$GITHUB_OUTPUT"

      - name: Build the community app from the verified package
        env:
          CODEX_LINUX_FEATURES_CONFIG: ${{ github.workspace }}/features.json
          CODEX_TARGET_ARCH: amd64
          CODEX_INSTALL_DIR: ${{ github.workspace }}/codex-app
          PACKAGE_WITH_UPDATER: '0'
          UPSTREAM_DEB: ${{ steps.upstream.outputs.package }}
        # Keep UPSTREAM_DEB available as a Make variable, but do not export it
        # to install.sh, which also receives the package path positionally.
        run: |
          set -euo pipefail
          make build-native-feature-helpers
          # Keep the checked-out upstream helper unchanged; patch only this temp copy.
          helper_parent="$RUNNER_TEMP/global-dictation-helper"
          helper_source="$helper_parent/global-dictation-linux"
          mkdir -p "$helper_source"
          cp global-dictation-linux/Cargo.toml global-dictation-linux/Cargo.lock "$helper_source/"
          cp -a global-dictation-linux/src "$helper_source/src"
          git -C "$helper_parent" apply --check \
            "$GITHUB_WORKSPACE/.github/patches/global-dictation-host-registry.patch"
          git -C "$helper_parent" apply \
            "$GITHUB_WORKSPACE/.github/patches/global-dictation-host-registry.patch"
          cargo test --manifest-path "$helper_source/Cargo.toml"
          cargo build --release --manifest-path "$helper_source/Cargo.toml"
          CODEX_GLOBAL_DICTATION_LINUX_SOURCE="$helper_source/target/release/codex-global-dictation-linux" \
            make --eval='unexport UPSTREAM_DEB' build-app

      - name: Verify the built app
        env:
          CODEX_LINUX_FEATURES_CONFIG: ${{ github.workspace }}/features.json
          UPSTREAM_DEB: ${{ steps.upstream.outputs.package }}
        run: |
          set -euo pipefail
          expected_features=$'global-dictation\nmcp-helper-reaper\nnode-repl-reaper\ntray-usage'
          actual_features="$(node scripts/lib/linux-features.js --enabled)"
          test "$actual_features" = "$expected_features"
          descriptor_count="$(node scripts/lib/linux-features.js --patch-descriptor-count)"
          if [ "$descriptor_count" -eq 0 ]; then
            upstream_root="$RUNNER_TEMP/upstream-package"
            mkdir -p "$upstream_root"
            dpkg-deb -x "$UPSTREAM_DEB" "$upstream_root"
            cmp "$upstream_root/usr/lib/chatgpt/resources/app.asar" \
              codex-app/resources/app.asar
          fi
          test -x codex-app/ChatGPT
          test -x codex-app/resources/codex

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGETOOL: ${{ steps.appimagetool.outputs.path }}
          PACKAGE_DISPLAY_NAME: ChatGPT Community
          PACKAGE_VERSION: ${{ steps.upstream.outputs.version }}
        run: make appimage PACKAGE_NAME="$APPIMAGE_ID"

      - name: Validate AppImage and write build metadata
        id: artifact
        env:
          OFFICIAL_RELEASE_ID: ${{ steps.upstream.outputs.release_id }}
          OFFICIAL_VERSION: ${{ steps.upstream.outputs.version }}
          OFFICIAL_AMD64_SHA256: ${{ steps.upstream.outputs.amd64_sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(dist/${APPIMAGE_ID}-*-x86_64.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one x86-64 AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          appimage="${appimages[0]}"
          test -s "$appimage"
          test -x "$appimage"

          extract_dir="$RUNNER_TEMP/appimage-validation"
          mkdir -p "$extract_dir"
          (
            cd "$extract_dir"
            env -u APPIMAGE_EXTRACT_AND_RUN \
              "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          test -x "$extract_dir/squashfs-root/AppRun"

          appimage_root="$extract_dir/squashfs-root/opt/$APPIMAGE_ID"
          desktop_file="$extract_dir/squashfs-root/$APPIMAGE_ID.desktop"
          test -f "$desktop_file"
          test -f "$extract_dir/squashfs-root/usr/share/applications/$APPIMAGE_ID.desktop"
          grep -Fx 'Name=ChatGPT Community' "$desktop_file"
          grep -Fx "Icon=$APPIMAGE_ID" "$desktop_file"
          runtime_file="$appimage_root/.codex-linux/codex-packaged-runtime.sh"
          test -f "$runtime_file"
          grep -Fx "    export CHROME_DESKTOP=\"${APPIMAGE_ID}.desktop\"" "$runtime_file"
          test -x "$appimage_root/resources/native/codex-global-dictation-linux"
          feature_report="$appimage_root/.codex-linux/build-info.json"
          test -f "$feature_report"
          node - "$feature_report" <<'NODE'
          const fs = require("node:fs");
          const [reportPath] = process.argv.slice(2);
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const expected = [
            "global-dictation",
            "mcp-helper-reaper",
            "node-repl-reaper",
            "tray-usage",
          ];
          if (JSON.stringify(report.linuxFeatures?.enabled) !== JSON.stringify(expected)) {
            throw new Error(`Packaged feature report does not match expected features: ${reportPath}`);
          }
          NODE

          mapfile -t packaged_launchers < <(
            find "$extract_dir/squashfs-root/opt" \
              -mindepth 2 -maxdepth 2 -type f -name start.sh -print
          )
          if [ "${#packaged_launchers[@]}" -ne 1 ]; then
            echo "Expected exactly one packaged launcher, found ${#packaged_launchers[@]}" >&2
            exit 1
          fi

          sha256sum "$appimage" > dist/SHA256SUMS
          artifact_name="$(basename "$appimage")"
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "app_id=$APPIMAGE_ID"
            echo "commit=$GITHUB_SHA"
            echo "upstream=https://github.com/ilysenko/codex-desktop-linux"
            echo "upstream_linux_release_id=$OFFICIAL_RELEASE_ID"
            echo "upstream_linux_version=$OFFICIAL_VERSION"
            echo "upstream_linux_amd64_sha256=$OFFICIAL_AMD64_SHA256"
            echo "workflow_run=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "built_at_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "artifact=$artifact_name"
          } > dist/BUILD-INFO.txt

          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          {
            echo "## AppImage artifact"
            echo
            echo "- File: \`$artifact_name\`"
            echo "- Official Linux version: \`$OFFICIAL_VERSION\`"
            echo "- Signed release ID: \`$OFFICIAL_RELEASE_ID\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 dist/SHA256SUMS)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-desktop-linux-appimage
          path: |
            ${{ steps.artifact.outputs.appimage }}
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
            upstream-linux-release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish immutable GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: chatgpt-linux-${{ steps.upstream.outputs.release_id }}
          APPIMAGE_PATH: ${{ steps.artifact.outputs.appimage }}
          OFFICIAL_RELEASE_ID: ${{ steps.upstream.outputs.release_id }}
          OFFICIAL_VERSION: ${{ steps.upstream.outputs.version }}
          OFFICIAL_AMD64_SHA256: ${{ steps.upstream.outputs.amd64_sha256 }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          cat > "$notes_file" <<EOF
          Automated AppImage built from the OpenAI signed Linux package.

          - Fork commit: \`$GITHUB_SHA\`
          - Official Linux version: \`$OFFICIAL_VERSION\`
          - Signed release ID: \`$OFFICIAL_RELEASE_ID\`
          - amd64 package SHA-256: \`$OFFICIAL_AMD64_SHA256\`

          <!-- official-linux-release:$OFFICIAL_RELEASE_ID -->
          EOF
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$APPIMAGE_PATH" \
            dist/SHA256SUMS \
            dist/BUILD-INFO.txt \
            upstream-linux-release.json \
            --title "$(basename "$APPIMAGE_PATH" .AppImage)" \
            --notes-file "$notes_file"
